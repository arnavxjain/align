<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000814; overflow: hidden; width: 100vw; height: 100vh; }
    #globe { width: 100vw; height: 100vh; display: block; }
    #zoom-controls {
      position: fixed; bottom: 100px; right: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      z-index: 100;
      background: rgba(255,255,255,0.07); border: 0.7px solid rgba(255,255,255,0.18);
      border-radius: 50px; padding: 6px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    #zoom-controls button {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: transparent; color: rgba(255,255,255,0.85);
      font-size: 22px; font-weight: 300; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; transition: background 0.15s;
    }
    #zoom-controls button:active { background: rgba(255,255,255,0.15); }
    #fade-overlay {
      position: fixed; inset: 0; background: #000814;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease; z-index: 50;
    }
  </style>
</head>
<body>
<div id="globe"></div>
<div id="fade-overlay"></div>
<div id="zoom-controls">
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">−</button>
</div>

    AX:[60.21,19.93],GF:[3.93,-53.12],NC:[-20.90,165.61],PF:[-17.68,-149.41]
  };

  var globe, pendingData, globeReady = false;
  var currentView = 'analyses';
  var marketDataMap = {};
  var geoLoaded = false;
  var lastAnalysesData = [];
  var pendingMarketData = null;
  var pendingGeoJson = null;

  function getMarketColor(pctStr) {
    var pct = parseFloat(pctStr);
    if (isNaN(pct)) return 'rgba(255,255,255,0.05)';
    var abs = Math.abs(pct);
    if (pct >= 0) {
      if (abs < 0.5)  return 'rgba(0,200,100,0.3)';
      if (abs < 1.5)  return 'rgba(0,200,100,0.55)';
      return 'rgba(0,200,100,0.85)';
    } else {
      if (abs < 0.5)  return 'rgba(255,60,60,0.3)';
      if (abs < 1.5)  return 'rgba(255,60,60,0.55)';
      return 'rgba(255,60,60,0.85)';
    }
  }

  function buildPoints(data) {
    var pts = [], rings = [];
    data.forEach(function(d) {
      var c = CENTROIDS[d.code];
      if (!c) return;
      var n = Math.max(1, d.count);
      var intensity = Math.min(n / 5, 1);
      var g = Math.round(210 + intensity * 45);
      var r = Math.round(20 + intensity * 37);
      var color = 'rgba(' + r + ',' + g + ',14,1.0)';
      pts.push({ code: d.code, lat: c[0], lng: c[1], color: color, size: 0.55 + n * 0.18 });
      rings.push({
        lat: c[0], lng: c[1], maxR: 6.0 + n * 1.0,
        colorFn: (function(rVal, gVal) {
          return function(t) {
            var opacity = Math.max(0, (1 - t * t) * 0.85);
            return 'rgba(' + rVal + ',' + gVal + ',14,' + opacity.toFixed(2) + ')';
          };
        })(r, g),
      });
    });
    return { pts: pts, rings: rings };
  }

  function applyData(data) {
    lastAnalysesData = data;
    var built = buildPoints(data);
    globe.pointsData(built.pts).ringsData(built.rings);
    if (window.GlobeReady) window.GlobeReady.postMessage('ok');
  }

  function applyGeoJson(data) {
    globe
      .polygonsData(data.features)
      .polygonCapColor(function() { return 'rgba(0,60,120,0.3)'; })
      .polygonSideColor(function() { return 'rgba(0,60,120,0.15)'; })
      .polygonStrokeColor(function() { return 'rgba(0,180,255,0.5)'; })
      .polygonAltitude(0.005);
    geoLoaded = true;
    console.log('[Globe] GeoJSON applied: ' + data.features.length + ' features');
    if (window.GlobeStatus) window.GlobeStatus.postMessage('geojson_ok:' + data.features.length);
    if (pendingMarketData !== null) {
      marketDataMap = pendingMarketData;
      pendingMarketData = null;
    }
    if (currentView === 'markets') applyMarketsView();
  }

  window.setGeoJson = function(data) {
    if (!globe) { pendingGeoJson = data; return; }
    applyGeoJson(data);
  };

  function applyMarketsView() {
    globe
      .polygonCapColor(function(feat) {
        var code = feat.properties.ISO_A2;
        var d = marketDataMap[code];
        if (!d) return 'rgba(50,50,80,0.45)';
        return getMarketColor(d.percent_change);
      })
      .polygonSideColor(function() { return 'rgba(0,0,0,0.15)'; })
      .polygonStrokeColor(function() { return 'rgba(255,255,255,0.12)'; })
      .polygonAltitude(0.008);
  }

  function zoomIn() {
    if (!globe) return;
    var pov = globe.pointOfView();
    globe.pointOfView({ altitude: Math.max(1.2, pov.altitude * 0.72) }, 350);
  }

  function zoomOut() {
    if (!globe) return;
    var pov = globe.pointOfView();
    globe.pointOfView({ altitude: Math.min(9.0, pov.altitude * 1.38) }, 350);
  }

  function boot() {
    var el = document.getElementById('globe');
    globe = Globe({ animateIn: true })(el)
      .width(window.innerWidth)
      .height(window.innerHeight)
      .backgroundColor('#000814')
      .atmosphereColor('rgba(0,180,255,0.9)')
      .atmosphereAltitude(0.25)
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .pointsData([])
      .pointLat('lat').pointLng('lng').pointColor('color').pointRadius('size')
      .pointAltitude(0.01)
      .ringsData([])
      .ringLat('lat').ringLng('lng')
      .ringColor(function(d) { return d.colorFn; })
      .ringMaxRadius('maxR').ringPropagationSpeed(3.0).ringRepeatPeriod(1200)
      .onPointClick(function(d) {
        if (currentView !== 'analyses') return;
        if (window.CountryTapped) window.CountryTapped.postMessage(d.code);
      })
      .onPolygonClick(function(feat) {
        if (currentView !== 'markets') return;
        var code = feat.properties.ISO_A2;
        if (code && code !== '-99' && window.MarketCountryTapped) {
          window.MarketCountryTapped.postMessage(code);
        }
      });

    var ctl = globe.controls();
    ctl.autoRotate = true;
    ctl.autoRotateSpeed = 0.4;
    ctl.enableDamping = true;
    ctl.dampingFactor = 0.08;
    ctl.minDistance = 150;
    ctl.maxDistance = 900;
    globe.pointOfView({ altitude: 1.2 });

    var resumeTimer;
    el.addEventListener('pointerdown', function() { clearTimeout(resumeTimer); ctl.autoRotate = false; });
    el.addEventListener('pointerup', function() {
      resumeTimer = setTimeout(function() { ctl.autoRotate = true; }, 3000);
    });
    window.addEventListener('resize', function() { globe.width(window.innerWidth).height(window.innerHeight); });

    // GeoJSON is injected from Flutter via setGeoJson() — apply if it arrived early.
    if (pendingGeoJson) { applyGeoJson(pendingGeoJson); pendingGeoJson = null; }

    globeReady = true;
    if (pendingData) { applyData(pendingData); pendingData = null; }
  }

  window.setCountryData = function(obj) {
    var arr = Object.keys(obj).map(function(code) { return { code: code, count: obj[code] }; });
    if (globeReady) { applyData(arr); } else { pendingData = arr; }
  };

  window.setMarketData = function(obj) {
    marketDataMap = obj;
    if (!geoLoaded) {
      // GeoJSON not ready yet — store and apply once it finishes loading
      pendingMarketData = obj;
    } else if (currentView === 'markets') {
      applyMarketsView();
    }
  };

  window.showAnalysesView = function() {
    if (!globe) return;
    currentView = 'analyses';
    var built = buildPoints(lastAnalysesData);
    globe
      .pointsData(built.pts).ringsData(built.rings)
      .polygonCapColor(function() { return 'rgba(0,60,120,0.3)'; })
      .polygonSideColor(function() { return 'rgba(0,60,120,0.15)'; })
      .polygonStrokeColor(function() { return 'rgba(0,180,255,0.5)'; })
      .polygonAltitude(0.005);
  };

  window.showMarketsView = function() {
    if (!globe) return;
    currentView = 'markets';
    globe.pointsData([]).ringsData([]);
    if (geoLoaded) applyMarketsView();
  };

  function tryBoot() {
    if (typeof Globe !== 'undefined') { boot(); } else { setTimeout(tryBoot, 500); }
  }
  window.addEventListener('load', tryBoot);
</script>
</body>
</html>
